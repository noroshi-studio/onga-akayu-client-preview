    <path d="M0 566c259-55 460-52 629-15 196 43 386 31 571-16"/>
    <path d="M0 654c240-51 445-50 641-14 199 36 385 24 559-12"/>
  </g>
  <g stroke="#4d604b" stroke-width="3" opacity=".5">

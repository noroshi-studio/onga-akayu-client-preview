<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">田園に佇む遠賀川温泉のイメージ</title>
  <desc id="desc">夕暮れ前の空、稲田、一軒家型の温泉、湯気を描いたオリジナルイラスト</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbe8e4"/>
      <stop offset=".62" stop-color="#efe8d6"/>
      <stop offset="1" stop-color="#e3cda0"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9ca66c"/>
      <stop offset="1" stop-color="#b8933f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8e7e1"/>
      <stop offset=".55" stop-color="#c7a269"/>
      <stop offset="1" stop-color="#a8422b"/>
    </linearGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
    <style>
      .steam{animation:float 6s ease-in-out infinite;transform-origin:center;opacity:.52}
      .steam:nth-of-type(2){animation-delay:-2s}.steam:nth-of-type(3){animation-delay:-4s}
      @keyframes float{0%,100%{transform:translateY(5px)}50%{transform:translateY(-10px)}}
      @media(prefers-reduced-motion:reduce){.steam{animation:none}}
    </style>
  </defs>
  <rect width="1200" height="760" rx="28" fill="url(#sky)"/>
  <circle cx="948" cy="132" r="58" fill="#f5e4ba" opacity=".8"/>
